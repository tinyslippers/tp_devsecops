name: DevSecOps Pipeline

on:
  push:
    branches: [ main, vuln-demo ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1 : QUALITÉ & TESTS (Gate Fonctionnelle)
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r services/catalog/requirements.txt
          pip install pytest requests
          
      # Gate 1 : Si les tests échouent, on arrête tout
      - name: Run Unit Tests
        run: pytest services/catalog/tests

  # JOB 2 : SÉCURITÉ STATIQUE (SAST & SECRETS)
  security-static:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # On scan uniquement le code actuel

      # Gate 2 : Gitleaks (Secrets) - Bloque si un secret est trouvé
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false 

      # Gate 3 : Semgrep (SAST Code) - Bloque si code dangereux
      - name: Semgrep Code Scan
        run: |
          pip install semgrep
          # Scan bloquant (--error) et export JSON pour le rapport
          semgrep scan --config=p/python --error --json -o semgrep-report.json services/catalog
      
      # Sauvegarde du rapport Semgrep (Artefact demandé partie 4)
      - name: Upload Semgrep Report
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      # Gate 4 : Trivy FS (Dépendances) - Bloque si librairie critique
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # JOB 3 : BUILD & CONTAINER SECURITY
  build-and-scan:
    needs: security-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t travel-app:${{ github.sha }} ./services/catalog

      # Gate 5 : Trivy Image (Conteneur) - Bloque si OS vulnérable
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'travel-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          output: 'trivy-image-report.txt'

      # Sauvegarde du rapport Trivy (Artefact demandé partie 4)
      - name: Upload Trivy Image Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

  # JOB 4 : DAST (Staging & Attack)
  dast-scan:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Lancement de l'app en mode "Staging"
      - name: Start Staging Environment
        run: |
          docker build -t travel-app ./services/catalog
          docker run -d -p 5000:5000 --name staging travel-app
          sleep 5 # Attente du démarrage

      # Gate 6 : OWASP ZAP (Scan Dynamique)
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: true # BLOQUANT
          allow_issue_severities: true

name: DevSecOps Pipeline

on: [push, pull_request]

permissions:
  contents: read
  issues: write
  checks: write
  pull-requests: write

jobs:

  # ÉTAPE 1 : ANALYSE DU CODE (SAST & SECRETS)
  security-code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep - SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python

  # ÉTAPE 2 : BUILD & CONTAINER SCAN
  build-and-scan-image:
    needs: security-code-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} ./services/catalog

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myapp:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ÉTAPE 3 : RUNTIME MONITORING GATE (Partie F du TP2)
  runtime_gate:
    needs: build-and-scan-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Launch Staging for Monitoring
        run: |
          # Redémarrage propre pour isoler les logs du test de trafic
          docker compose -f compose.staging.yml down -v
          docker compose -f compose.staging.yml up -d --build
          sleep 5

      - name: Run Runtime Security Gate
        run: |
          # Exécute la gate avec les paramètres de ton staging
          BASE_URL=http://localhost:5002 SERVICE=catalog MAX_5XX=5 bash monitoring/log_gate.sh
        
      - name: Archive Reports
        if: always() # Toujours conserver pour diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: runtime-monitoring-reports
          path: reports/
